name: Windows Production Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  windows-production:
    name: Windows Setup and Portable
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify version consistency
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/verify-version.mjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Virelo version: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Frontend validation
        run: npm run check

      - name: Build Windows application and NSIS installer
        run: npm --workspace @virelo/desktop run tauri -- build --bundles nsis

      - name: Collect Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $portable = Get-ChildItem "apps/desktop/src-tauri/target/release/*.exe" | Select-Object -First 1
          $setup = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $portable) { throw "Portable executable was not produced." }
          if (-not $setup) { throw "NSIS setup executable was not produced." }
          Copy-Item $portable.FullName "artifacts/Virelo-Portable.exe"
          Copy-Item $setup.FullName "artifacts/Virelo-Setup.exe"
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = @("artifacts/Virelo-Portable.exe", "artifacts/Virelo-Setup.exe")
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing artifact: $file" }
            $item = Get-Item $file
            if ($item.Length -lt 1000000) { throw "Artifact is unexpectedly small: $file" }
            $stream = [System.IO.File]::OpenRead($file)
            try {
              $first = $stream.ReadByte()
              $second = $stream.ReadByte()
            } finally {
              $stream.Dispose()
            }
            if ($first -ne 0x4D -or $second -ne 0x5A) {
              throw "Invalid Windows PE header: $file"
            }
          }

      - name: Verify GUI subsystem
        shell: pwsh
        run: |
          $file = "artifacts/Virelo-Portable.exe"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $optionalHeader = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Virelo Portable is not a Windows GUI subsystem executable. Subsystem=$subsystem"
          }
          Write-Host "Windows GUI subsystem verified. No console window should be created."

      - name: Portable EXE launch smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/artifacts/Virelo-Portable.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Virelo portable executable exited during launch smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Portable launch smoke test passed."

      - name: Setup install and launch smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "$PWD/artifacts/Virelo-Setup.exe").Path
          $installRoot = Join-Path $env:LOCALAPPDATA "Virelo"

          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force
          }

          $installer = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Virelo Setup silent install failed with code $($installer.ExitCode)."
          }

          $installed = Get-ChildItem $installRoot -Recurse -File -Filter "Virelo.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installed) {
            throw "Virelo Setup completed but the installed Virelo.exe was not found under $installRoot."
          }

          $process = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Installed Virelo exited during launch smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Setup install and installed-app launch smoke test passed: $($installed.FullName)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Virelo-Windows-${{ steps.version.outputs.version }}
          path: |
            artifacts/Virelo-Portable.exe
            artifacts/Virelo-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "Virelo v$version" --notes "Virelo $version dovršava produkcijsku isporuku za Windows, macOS i Linux. Windows pipeline provjerava PE i GUI subsystem, Portable launch te stvarnu tihu instalaciju i pokretanje instalirane aplikacije. macOS i Linux pipelineovi dodaju vlastite provjerene pakete na isti release."
          }
          gh release upload $tag "artifacts/Virelo-Portable.exe" "artifacts/Virelo-Setup.exe" --clobber
