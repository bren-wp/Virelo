name: macOS Production Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  macos-production:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Frontend validation
        run: npm run check

      - name: Import Apple signing certificate
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/virelo-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/virelo-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build unsigned macOS application and DMG
        if: env.HAS_APPLE_CERTIFICATE != 'true'
        shell: bash
        run: npm --workspace @virelo/desktop run tauri -- build --target "${{ matrix.target }}" --bundles app,dmg

      - name: Build signed macOS application and DMG
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm --workspace @virelo/desktop run tauri -- build --target "${{ matrix.target }}" --bundles app,dmg

      - name: Collect and verify macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_PATH="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" || { echo "Virelo.app was not produced."; exit 1; }
          test -n "$DMG_PATH" || { echo "Virelo.dmg was not produced."; exit 1; }
          test -f "$APP_PATH/Contents/Info.plist" || { echo "Info.plist is missing."; exit 1; }

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"

          test "$BUNDLE_ID" = "com.virelo.desktop" || { echo "Unexpected bundle identifier: $BUNDLE_ID"; exit 1; }
          test "$VERSION" = "1.8.0" || { echo "Unexpected bundle version: $VERSION"; exit 1; }
          test -x "$APP_PATH/Contents/MacOS/$EXECUTABLE" || { echo "App executable is missing."; exit 1; }

          mkdir -p artifacts
          cp "$DMG_PATH" "artifacts/Virelo-macOS-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/Virelo-macOS-${{ matrix.arch }}-app.zip"
          ls -lh artifacts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Virelo-macOS-${{ matrix.arch }}-1.8.0
          path: |
            artifacts/Virelo-macOS-${{ matrix.arch }}.dmg
            artifacts/Virelo-macOS-${{ matrix.arch }}-app.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish macOS assets to v1.8.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.8.0"
          FOUND=0
          for _ in {1..60}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            sleep 10
          done
          test "$FOUND" = "1" || { echo "Release $TAG was not created by the Windows production workflow."; exit 1; }
          gh release upload "$TAG"             "artifacts/Virelo-macOS-${{ matrix.arch }}.dmg"             "artifacts/Virelo-macOS-${{ matrix.arch }}-app.zip"             --clobber
