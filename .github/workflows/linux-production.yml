name: Linux Production Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  linux-production:
    name: Linux AppImage and DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify version consistency
        id: version
        shell: bash
        run: |
          VERSION="$(node scripts/verify-version.mjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Virelo version: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Frontend validation
        run: npm run check

      - name: Build Linux bundles
        run: npm --workspace @virelo/desktop run tauri -- build --bundles appimage,deb

      - name: Collect and verify Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find apps/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          DEB="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$APPIMAGE" || { echo "AppImage was not produced."; exit 1; }
          test -n "$DEB" || { echo "DEB was not produced."; exit 1; }
          test -s "$APPIMAGE" || { echo "AppImage is empty."; exit 1; }
          test -s "$DEB" || { echo "DEB is empty."; exit 1; }
          dpkg-deb --info "$DEB" >/dev/null

          mkdir -p artifacts
          cp "$APPIMAGE" "artifacts/Virelo.AppImage"
          cp "$DEB" "artifacts/virelo.deb"
          chmod +x "artifacts/Virelo.AppImage"
          ls -lh artifacts

      - name: AppImage launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/virelo-appimage-smoke.log"

          dbus-run-session -- xvfb-run -a bash -c '
            set -euo pipefail
            env APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 ./artifacts/Virelo.AppImage >"'"$LOG"'" 2>&1 &
            PID=$!
            sleep 8
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "'"$LOG"'"
              wait "$PID" || true
              exit 1
            fi
            kill "$PID"
            wait "$PID" || true
          '

          echo "Linux AppImage launch smoke test passed."

      - name: DEB install and launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./artifacts/virelo.deb
          INSTALLED_BIN="$(dpkg -L virelo-desktop 2>/dev/null | awk '/\/usr\/bin\// { print; exit }')"

          if [ -z "$INSTALLED_BIN" ] || [ ! -x "$INSTALLED_BIN" ]; then
            PACKAGE_NAME="$(dpkg-deb -f artifacts/virelo.deb Package)"
            INSTALLED_BIN="$(dpkg -L "$PACKAGE_NAME" | awk '/\/usr\/bin\// { print; exit }')"
          fi

          test -n "$INSTALLED_BIN" || { echo "Installed Virelo binary was not found."; exit 1; }
          test -x "$INSTALLED_BIN" || { echo "Installed Virelo binary is not executable: $INSTALLED_BIN"; exit 1; }

          LOG="$RUNNER_TEMP/virelo-deb-smoke.log"
          dbus-run-session -- xvfb-run -a bash -c '
            set -euo pipefail
            env WEBKIT_DISABLE_COMPOSITING_MODE=1 "'"$INSTALLED_BIN"'" >"'"$LOG"'" 2>&1 &
            PID=$!
            sleep 8
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "'"$LOG"'"
              wait "$PID" || true
              exit 1
            fi
            kill "$PID"
            wait "$PID" || true
          '

          echo "Linux DEB install and launch smoke test passed."

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Virelo-Linux-${{ steps.version.outputs.version }}
          path: |
            artifacts/Virelo.AppImage
            artifacts/virelo.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish Linux assets to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          FOUND=0
          for _ in {1..60}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            sleep 10
          done
          test "$FOUND" = "1" || { echo "Release $TAG was not created by the Windows production workflow."; exit 1; }
          gh release upload "$TAG" "artifacts/Virelo.AppImage" "artifacts/virelo.deb" --clobber
